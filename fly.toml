app = 'movierecommender-arjun'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  FLASK_DEBUG = '0'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

[[vm]]
  size = 'shared-cpu-1x'
  cpu_kind = 'shared'
  cpus = 1
  memory = '512mb'